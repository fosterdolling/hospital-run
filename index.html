<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f3b45">
<title>Hospital Run</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #0f3b45;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }
  #hud {
    position: fixed; left: 0; right: 0; top: 0; padding: calc(env(safe-area-inset-top) + 10px) 16px 0;
    display: none; justify-content: space-between; color: #fff; pointer-events: none;
    text-shadow: 0 2px 4px rgba(0,0,0,.45); font-weight: 800;
  }
  #hud .big { font-size: 30px; line-height: 1; }
  #hud .small { font-size: 12px; opacity: .85; letter-spacing: .08em; text-transform: uppercase; margin-top: 2px; }
  #hud .right { text-align: right; }
  .overlay {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; color: #fff; padding: 24px; background: rgba(10, 45, 55, .72);
  }
  .overlay.hidden { display: none; }
  .logo {
    font-size: clamp(38px, 12vw, 64px); font-weight: 900; line-height: .95; letter-spacing: -.02em;
    text-shadow: 0 4px 0 #0a6a73, 0 8px 18px rgba(0,0,0,.35);
  }
  .logo span { color: #ff6b6b; }
  .sub { margin: 10px 0 24px; font-size: 16px; opacity: .9; }
  button {
    font: inherit; font-weight: 800; font-size: 22px; padding: 14px 40px; border: 0; border-radius: 999px;
    background: #ff6b6b; color: #fff; box-shadow: 0 5px 0 #c24848; cursor: pointer; touch-action: manipulation;
  }
  button:active { transform: translateY(3px); box-shadow: 0 2px 0 #c24848; }
  .help { margin-top: 26px; font-size: 15px; line-height: 1.9; opacity: .95; }
  .help b { display: inline-block; min-width: 2.2em; padding: 1px 8px; margin-right: 6px; border-radius: 8px;
    background: rgba(255,255,255,.18); font-weight: 800; }
  .best { margin-top: 18px; font-size: 14px; opacity: .8; }
</style>
</head>
<body>
<div id="hud">
  <div><div class="big" id="score">0 m</div><div class="small">Distance</div></div>
  <div class="right"><div class="big" id="best">0 m</div><div class="small">Best</div></div>
</div>

<div id="start" class="overlay">
  <div class="logo">HOSPITAL<br><span>RUN</span></div>
  <div class="sub">Code Run: the hallway never ends.</div>
  <button id="startBtn">Start shift</button>
  <div class="help">
    <div><b>&larr; &rarr;</b> swipe to change lanes</div>
    <div><b>&uarr;</b> swipe to jump</div>
    <div><b>&darr;</b> swipe to slide</div>
  </div>
  <div class="best" id="bestStart"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script>
(function () {
'use strict';

/* ------------------------------------------------------------------ *
 *  Tunables
 * ------------------------------------------------------------------ */
const HALL_W   = 7;          // hallway width (x from -3.5 .. 3.5)
const HALL_H   = 3.3;        // ceiling height
const LANE_W   = 1.7;        // distance between lane centres
const SEG_LEN  = 10;         // length of one hallway segment
const SEG_COUNT = 12;        // recycled segments alive at once
const START_SPEED = 11;      // m/s
const MAX_SPEED   = 24;
const SPEED_RAMP  = 0.09;    // m/s gained per second
const GRAVITY  = 32;
const JUMP_V   = 11;
const SLIDE_TIME = 0.75;
const LANE_SPEED = 14;       // how fast the runner glides between lanes

/* ------------------------------------------------------------------ *
 *  Renderer / scene
 * ------------------------------------------------------------------ */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
document.body.prepend(renderer.domElement);

const FOG_COLOR = 0xe4eef0;
const scene = new THREE.Scene();
scene.background = new THREE.Color(FOG_COLOR);
scene.fog = new THREE.Fog(FOG_COLOR, 22, 88);

const camera = new THREE.PerspectiveCamera(70, 1, 0.1, 120);

scene.add(new THREE.HemisphereLight(0xffffff, 0x9fb7bd, 0.95));
const sun = new THREE.DirectionalLight(0xffffff, 0.45);
sun.position.set(-2, 6, 4);
scene.add(sun);

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.fov = camera.aspect < 0.75 ? 82 : camera.aspect < 1.2 ? 74 : 64;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', resize);
resize();

/* ------------------------------------------------------------------ *
 *  Little helpers (cached geometry + materials keep draw cost low)
 * ------------------------------------------------------------------ */
const matCache = {}, geoCache = {};
function mat(color, opts) {
  const key = color + (opts ? JSON.stringify(opts) : '');
  if (!matCache[key]) {
    matCache[key] = (opts && opts.basic)
      ? new THREE.MeshBasicMaterial({ color })
      : new THREE.MeshLambertMaterial(Object.assign({ color }, opts || {}));
  }
  return matCache[key];
}
function geo(w, h, d) {
  const key = w + 'x' + h + 'x' + d;
  return geoCache[key] || (geoCache[key] = new THREE.BoxGeometry(w, h, d));
}
function box(parent, w, h, d, color, x, y, z, opts) {
  const m = new THREE.Mesh(geo(w, h, d), mat(color, opts));
  m.position.set(x, y, z);
  parent.add(m);
  return m;
}
function freeze(group) {            // static children don't need per-frame matrix updates
  group.children.forEach(function (c) { c.updateMatrix(); c.matrixAutoUpdate = false; });
}
const pick = function (arr) { return arr[(Math.random() * arr.length) | 0]; };

/* ------------------------------------------------------------------ *
 *  Floor texture (checkered tiles)
 * ------------------------------------------------------------------ */
function makeFloorTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const g = c.getContext('2d');
  g.fillStyle = '#d4e0e3'; g.fillRect(0, 0, 128, 128);
  g.fillStyle = '#b4c9cf'; g.fillRect(0, 0, 64, 64); g.fillRect(64, 64, 64, 64);
  g.strokeStyle = 'rgba(0,0,0,.06)'; g.lineWidth = 2; g.strokeRect(0, 0, 128, 128);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(HALL_W / 2.4, SEG_LEN / 2.4);
  t.anisotropy = 4;
  return t;
}
const floorTex = makeFloorTexture();

/* ------------------------------------------------------------------ *
 *  Hallway segment (built once, re-dressed every time it recycles)
 * ------------------------------------------------------------------ */
const DOOR_COLORS = [0x8d6e4b, 0x6f8fa6, 0x9aa86e, 0xb0785b, 0x7a7fb0];
const halfW = HALL_W / 2;

function buildSegment() {
  const g = new THREE.Group();
  // local space: z runs 0 (near, +z side) to -SEG_LEN (far)
  const mid = -SEG_LEN / 2;

  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(HALL_W, SEG_LEN),
    new THREE.MeshBasicMaterial({ map: floorTex }));
  floor.rotation.x = -Math.PI / 2;
  floor.position.set(0, 0, mid);
  g.add(floor);

  box(g, HALL_W + 0.4, 0.3, SEG_LEN, 0xd9e4e6, 0, HALL_H + 0.15, mid, { basic: true });           // ceiling slab

  [-1, 1].forEach(function (s) {
    const wx = s * (halfW + 0.1);
    box(g, 0.2, 1.05, SEG_LEN, 0x4f8f98, wx, 0.525, mid);                        // lower wall (teal)
    box(g, 0.2, HALL_H - 1.05, SEG_LEN, 0xf2ece0, wx, 1.05 + (HALL_H - 1.05) / 2, mid); // upper wall (cream)
    box(g, 0.14, 0.09, SEG_LEN, 0xc9a574, s * (halfW - 0.02), 1.0, mid);          // handrail
    box(g, 0.04, 0.12, SEG_LEN, 0xe0657a, s * (halfW - 0.005), 2.5, mid);         // pink stripe
  });

  // ceiling light panels
  [-2.5, -7.5].forEach(function (z) {
    box(g, 2.4, 0.06, 1.2, 0xfffbe6, 0, HALL_H - 0.02, z, { basic: true });
  });

  // doors: two slots per side
  g.userData.doors = [];
  [-1, 1].forEach(function (s) {
    [-2.5, -7.5].forEach(function (z) {
      const d = new THREE.Group();
      const slab = box(d, 0.1, 2.3, 1.3, DOOR_COLORS[0], 0, 1.15, 0);
      box(d, 0.12, 0.45, 0.35, 0xbfe3ee, 0, 1.55, 0, { basic: true });             // little window
      box(d, 0.12, 0.2, 0.4, 0xffffff, 0, 2.5, 0);                                // room number plate
      d.position.set(s * (halfW - 0.02), 0, z);
      d.userData.slab = slab;
      g.add(d);
      freeze(d);
      g.userData.doors.push(d);
    });
  });

  // wall extras at the mid-point of each side: bench / sanitiser / extinguisher / none
  g.userData.extras = [];
  [-1, 1].forEach(function (s) {
    const e = [];
    const bench = new THREE.Group();
    box(bench, 0.5, 0.12, 1.8, 0x3a6ea5, 0, 0.5, 0);
    box(bench, 0.5, 0.5, 0.1, 0x2d5a8a, 0, 0.25, -0.8);
    box(bench, 0.5, 0.5, 0.1, 0x2d5a8a, 0, 0.25, 0.8);
    const sani = new THREE.Group();
    box(sani, 0.12, 0.3, 0.18, 0xffffff, 0, 1.3, 0);
    box(sani, 0.14, 0.06, 0.1, 0x4cc3d9, 0, 1.4, 0);
    const ext = new THREE.Group();
    box(ext, 0.22, 0.55, 0.22, 0xd62f2f, 0, 0.9, 0);
    box(ext, 0.1, 0.1, 0.1, 0x222222, 0, 1.22, 0);
    [bench, sani, ext].forEach(function (o) {
      o.position.set(s * (halfW - (o === bench ? 0.3 : 0.1)), 0, -5);
      g.add(o); freeze(o); o.visible = false; e.push(o);
    });
    g.userData.extras.push(e);
  });

  freeze(g);
  return g;
}

function dressSegment(g) {
  g.userData.doors.forEach(function (d) {
    d.visible = Math.random() < 0.65;
    d.userData.slab.material = mat(pick(DOOR_COLORS));
  });
  g.userData.extras.forEach(function (list) {
    list.forEach(function (o) { o.visible = false; });
    if (Math.random() < 0.5) pick(list).visible = true;
  });
}

const segments = [];
for (let i = 0; i < SEG_COUNT; i++) {
  const s = buildSegment();
  s.position.z = -i * SEG_LEN + SEG_LEN * 2;       // a couple behind the start
  dressSegment(s);
  scene.add(s);
  segments.push(s);
}
// the very end of the world is a bright blank wall so the fog fades nicely
let frontZ = segments[segments.length - 1].position.z - SEG_LEN;

function recycleSegments(playerZ) {
  for (let i = 0; i < segments.length; i++) {
    const s = segments[i];
    if (s.position.z - SEG_LEN > playerZ + 10) {   // fully behind the camera
      s.position.z = frontZ;
      frontZ -= SEG_LEN;
      dressSegment(s);
    }
  }
}

/* ------------------------------------------------------------------ *
 *  The runner: a blocky nurse
 * ------------------------------------------------------------------ */
const player = new THREE.Group();
scene.add(player);
const body = new THREE.Group();          // everything that squashes / bobs
player.add(body);

const SKIN = 0xf1c7a3, SCRUBS = 0x1fb5a8, SCRUBS_D = 0x168c83;
box(body, 0.46, 0.5, 0.26, SCRUBS, 0, 1.12, 0);                    // torso
box(body, 0.2, 0.1, 0.05, 0xffffff, -0.1, 1.2, -0.14);             // pocket
box(body, 0.1, 0.1, 0.02, 0xffd54a, 0.1, 1.28, -0.14);             // badge
const head = box(body, 0.3, 0.3, 0.3, SKIN, 0, 1.52, 0);
box(head, 0.32, 0.12, 0.32, 0x5b3a29, 0, 0.1, -0.02);             // hair
box(head, 0.18, 0.16, 0.16, 0x5b3a29, 0, 0.12, 0.2);              // bun
box(head, 0.34, 0.07, 0.2, 0xffffff, 0, 0.2, 0.04);               // nurse cap
box(head, 0.07, 0.03, 0.01, 0xd62f2f, 0, 0.2, -0.15);             // cap cross
box(head, 0.03, 0.14, 0.01, 0xd62f2f, 0, 0.2, -0.15);
box(body, 0.2, 0.04, 0.04, 0x37474f, 0, 1.33, -0.1);               // stethoscope

function limb(w, h, d, color, x, y, z, footColor) {
  const pivot = new THREE.Group();
  pivot.position.set(x, y, z);
  box(pivot, w, h, d, color, 0, -h / 2, 0);
  if (footColor) box(pivot, w + 0.04, 0.1, d + 0.12, footColor, 0, -h + 0.05, -0.05);
  body.add(pivot);
  return pivot;
}
const armL = limb(0.14, 0.5, 0.14, SCRUBS, -0.32, 1.33, 0);
const armR = limb(0.14, 0.5, 0.14, SCRUBS, 0.32, 1.33, 0);
const legL = limb(0.17, 0.87, 0.17, SCRUBS_D, -0.12, 0.87, 0, 0xffffff);
const legR = limb(0.17, 0.87, 0.17, SCRUBS_D, 0.12, 0.87, 0, 0xffffff);

/* ------------------------------------------------------------------ *
 *  Game state
 * ------------------------------------------------------------------ */
const state = {
  mode: 'menu',            // 'menu' | 'playing'
  z: 0,
  speed: START_SPEED,
  time: 0,
  lane: 0,                 // -1, 0, 1
  x: 0,
  y: 0, vy: 0, onGround: true,
  slideT: 0,
  runPhase: 0,
  camX: 0
};

let best = 0;
try { best = parseInt(localStorage.getItem('hospitalRunBest') || '0', 10) || 0; } catch (e) {}

const elScore = document.getElementById('score');
const elBest = document.getElementById('best');
const elHud = document.getElementById('hud');
const elStart = document.getElementById('start');
const elBestStart = document.getElementById('bestStart');

function refreshBestText() {
  elBest.textContent = best + ' m';
  elBestStart.textContent = best > 0 ? 'Best run: ' + best + ' m' : '';
}
refreshBestText();

function startGame() {
  state.mode = 'playing';
  state.z = 0; state.time = 0; state.speed = START_SPEED;
  state.lane = 0; state.x = 0; state.y = 0; state.vy = 0; state.onGround = true; state.slideT = 0;
  elStart.classList.add('hidden');
  elHud.style.display = 'flex';
}

/* ------------------------------------------------------------------ *
 *  Input: swipes (touch/mouse) + arrow keys / WASD
 * ------------------------------------------------------------------ */
function moveLane(dir) {
  state.lane = Math.max(-1, Math.min(1, state.lane + dir));
}
function jump() {
  if (state.onGround) {
    state.vy = JUMP_V; state.onGround = false; state.slideT = 0;
  }
}
function slide() {
  if (!state.onGround) { state.vy = Math.min(state.vy, -14); }   // fast-fall
  state.slideT = SLIDE_TIME;
}
function handleAction(a) {
  if (state.mode !== 'playing') return;
  if (a === 'left') moveLane(-1);
  else if (a === 'right') moveLane(1);
  else if (a === 'up') jump();
  else if (a === 'down') slide();
}

const SWIPE_MIN = 24;
let sx = 0, sy = 0, tracking = false;
const surface = renderer.domElement;
surface.addEventListener('pointerdown', function (e) {
  tracking = true; sx = e.clientX; sy = e.clientY;
  try { surface.setPointerCapture(e.pointerId); } catch (err) {}
  e.preventDefault();
});
surface.addEventListener('pointermove', function (e) {
  if (!tracking) return;
  const dx = e.clientX - sx, dy = e.clientY - sy;
  if (Math.abs(dx) < SWIPE_MIN && Math.abs(dy) < SWIPE_MIN) return;
  if (Math.abs(dx) > Math.abs(dy)) handleAction(dx < 0 ? 'left' : 'right');
  else handleAction(dy < 0 ? 'up' : 'down');
  sx = e.clientX; sy = e.clientY;          // allow chained swipes without lifting
  e.preventDefault();
});
function endTrack() { tracking = false; }
surface.addEventListener('pointerup', endTrack);
surface.addEventListener('pointercancel', endTrack);

// belt-and-braces: stop iOS from scrolling / rubber-banding / zooming
['touchmove', 'gesturestart', 'gesturechange'].forEach(function (ev) {
  document.addEventListener(ev, function (e) { e.preventDefault(); }, { passive: false });
});
document.addEventListener('contextmenu', function (e) { e.preventDefault(); });

window.addEventListener('keydown', function (e) {
  const k = e.key;
  if (state.mode === 'menu') {
    if (k === 'Enter' || k === ' ') { startGame(); e.preventDefault(); }
    return;
  }
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') handleAction('left');
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') handleAction('right');
  else if (k === 'ArrowUp' || k === 'w' || k === 'W' || k === ' ') handleAction('up');
  else if (k === 'ArrowDown' || k === 's' || k === 'S') handleAction('down');
  else return;
  e.preventDefault();
});

document.getElementById('startBtn').addEventListener('click', startGame);

/* ------------------------------------------------------------------ *
 *  Main loop
 * ------------------------------------------------------------------ */
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  update(dt);
  renderer.render(scene, camera);
}

function update(dt) {
  const playing = state.mode === 'playing';
  if (playing) {
    state.time += dt;
    state.speed = Math.min(MAX_SPEED, START_SPEED + state.time * SPEED_RAMP);
  } else {
    state.speed = 6;                       // gentle idle scroll behind the title screen
  }
  state.z -= state.speed * dt;

  // lane glide
  const targetX = state.lane * LANE_W;
  const dx = targetX - state.x;
  state.x += Math.sign(dx) * Math.min(Math.abs(dx), LANE_SPEED * dt);

  // jump physics
  if (!state.onGround) {
    state.vy -= GRAVITY * dt;
    state.y += state.vy * dt;
    if (state.y <= 0) { state.y = 0; state.vy = 0; state.onGround = true; }
  }
  if (state.slideT > 0) state.slideT -= dt;
  const sliding = state.slideT > 0 && state.onGround;

  // run cycle
  state.runPhase += state.speed * dt * 0.95;
  const sw = Math.sin(state.runPhase);
  const air = !state.onGround;
  if (sliding) {
    body.rotation.x = 1.2;                 // lie back, feet first
    body.position.y = 0.1;
    legL.rotation.x = legR.rotation.x = 0;
    armL.rotation.x = armR.rotation.x = -1.0;
  } else if (air) {
    body.rotation.x = -0.05; body.position.y = 0;
    legL.rotation.x = -0.9; legR.rotation.x = 0.5;
    armL.rotation.x = 2.4; armR.rotation.x = 2.4;
  } else {
    body.rotation.x = -0.12;
    body.position.y = Math.abs(Math.cos(state.runPhase)) * 0.07;
    legL.rotation.x = sw * 0.95; legR.rotation.x = -sw * 0.95;
    armL.rotation.x = -sw * 0.9; armR.rotation.x = sw * 0.9;
  }

  player.position.set(state.x, state.y, state.z);
  player.rotation.z = THREE.MathUtils.clamp(-(targetX - state.x) * 0.12, -0.25, 0.25);
  player.rotation.y = THREE.MathUtils.clamp(-(targetX - state.x) * 0.2, -0.4, 0.4);

  // chase camera
  state.camX += (state.x * 0.65 - state.camX) * Math.min(1, dt * 7);
  const camY = 2.35 + state.y * 0.25;
  camera.position.set(state.camX, camY, state.z + 4.8);
  camera.lookAt(state.camX * 0.9, 1.35 + state.y * 0.3, state.z - 7);

  recycleSegments(state.z);

  if (playing) {
    const dist = Math.floor(-state.z);
    elScore.textContent = dist + ' m';
    if (dist > best) {
      best = dist;
      elBest.textContent = best + ' m';
    }
  }
}

requestAnimationFrame(frame);

})();
</script>
</body>
</html>
